# Grepwise eval questions (phase 6.2). See docs/spec/06-ui-evals-launch.md, section 6.
#
# Sources these questions assume are indexed (all pinned; `make demo-sources` does it):
#   pallets/itsdangerous@2.2.0   repo     (code and docs, split by symbol and by heading)
#   fastapi/typer@0.27.2         repo
#   pallets/click@8.5.0          repo
#   petstore@1.0.27              openapi
#
# How to write a question:
#   1. Open the real file (grepwise read ... or GitHub at the tag) and find a specific answer.
#   2. Ask it the way a developer would, without copying the file's wording (that would make
#      keyword search look better than it is).
#   3. expect.paths: files a correct answer must cite (any one of them). For cross-source
#      questions use expect.paths_all: every listed file must be cited.
#   4. expect.facts: short phrases a correct answer must contain (case-insensitive). Prefer
#      specific names (SignatureExpired) over common words.
#   5. Unanswerable questions: expect: {absent: true}. The right answer says it isn't in the sources.
#
# Target: ~20 code, ~15 docs, ~5 api, ~10 cross, plus a few absent.
#
# Drafted by Claude after reading the files (2026-10-06), reviewed and approved by Aditya
# (2026-10-10). New questions can start with "draft: true" until checked; drafts only run
# with --include-drafts.

- id: code-01

  category: code
  question: How does TimestampSigner decide that a signature has expired?
  sources: [pallets/itsdangerous@2.2.0]
  expect:
    paths: [src/itsdangerous/timed.py]
    symbols: [TimestampSigner]
    # unsign() compares (now - signed timestamp) with max_age and raises SignatureExpired
    # if it's older (or if the age is negative, i.e. signed in the future).
    facts: [max_age, SignatureExpired]

- id: code-02

  category: code
  question: What ways can Signer derive its signing key from the secret, and which one is the default?
  sources: [pallets/itsdangerous@2.2.0]
  expect:
    paths: [src/itsdangerous/signer.py]
    symbols: [Signer]
    # Signer's docstring: key_derivation can be concat, django-concat or hmac; default django-concat.
    facts: [django-concat, hmac]

- id: code-03

  category: code
  question: "If I rotate my secret key, can tokens signed with the old key still be verified?"
  sources: [pallets/itsdangerous@2.2.0]
  expect:
    paths: [src/itsdangerous/signer.py]
    # secret_key may be a list, oldest first; signing uses secret_keys[-1] (the newest) and verify_signature tries every key from newest to oldest.
    facts: ["secret_keys", "newest"]

- id: code-04

  category: code
  question: "When does URLSafeSerializer compress the payload, and how can you tell a compressed token apart?"
  sources: [pallets/itsdangerous@2.2.0]
  expect:
    paths: [src/itsdangerous/url_safe.py]
    # It zlib-compresses the JSON and keeps it only if it's shorter; a compressed payload starts with a '.'.
    facts: ["zlib", "."]

- id: code-05

  category: code
  question: "Is there a way to read a signed payload even when its signature is wrong, and is that safe?"
  sources: [pallets/itsdangerous@2.2.0]
  expect:
    paths: [src/itsdangerous/serializer.py]
    # loads_unsafe returns (signature_valid, payload) instead of raising; the docstring warns not to use it with pickle (or any unsafe serializer).
    facts: ["loads_unsafe", "signature_valid"]

- id: code-06

  category: code
  question: "What's the difference between BadPayload and BadSignature in itsdangerous?"
  sources: [pallets/itsdangerous@2.2.0]
  expect:
    paths: [src/itsdangerous/exc.py]
    # BadPayload: the signature was valid but the payload couldn't be decoded/deserialized; it keeps the cause in original_error.
    facts: ["BadPayload", "original_error"]

- id: code-07

  category: code
  question: "Why can't I use a letter or digit as the separator character in itsdangerous's Signer?"
  sources: [pallets/itsdangerous@2.2.0]
  expect:
    paths: [src/itsdangerous/signer.py]
    # Signer raises ValueError if the separator is in the URL-safe base64 alphabet, since it would be ambiguous inside the signature.
    facts: ["ValueError", "base64"]

- id: code-08

  category: code
  question: "Which hash algorithm does itsdangerous's Signer use when you don't pass digest_method?"
  sources: [pallets/itsdangerous@2.2.0]
  expect:
    paths: [src/itsdangerous/signer.py]
    # The default is SHA-1 (via _lazy_sha1).
    facts: ["sha1"]

- id: code-09

  category: code
  question: "If I catch BadSignature, will that also catch an expired timestamp error?"
  sources: [pallets/itsdangerous@2.2.0]
  expect:
    paths: [src/itsdangerous/exc.py]
    # SignatureExpired subclasses BadTimeSignature, which subclasses BadSignature, so yes.
    facts: ["SignatureExpired", "BadTimeSignature"]

- id: code-10

  category: code
  question: "How does itsdangerous make its JSON output as compact as possible?"
  sources: [pallets/itsdangerous@2.2.0]
  expect:
    paths: [src/itsdangerous/_json.py]
    # _CompactJSON.dumps uses separators=(',', ':') with no whitespace, and ensure_ascii=False.
    facts: ["separators"]

- id: code-11

  category: code
  # The right answer is 'no, it was removed'. Tests whether the agent reads the changelog.
  question: "Can I still use itsdangerous to create JSON Web Signatures (JWS)?"
  sources: [pallets/itsdangerous@2.2.0]
  expect:
    paths: [CHANGES.rst]
    # JWS support was deprecated in 2.0 and removed in 2.1; the changelog points to a dedicated library such as Authlib.
    facts: ["Authlib"]

