name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # constraints.txt (what `make install` pins) must match uv.lock.
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project --no-header | diff - constraints.txt
      - run: uv run python -c 'import tree_sitter_language_pack as t; t.download(["python", "javascript", "typescript", "tsx"])'
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Offline: FakeEmbedder, a temporary SQLite database per test, no model download.
      - run: uv run pytest -q
