[project]
name = "grepwise"
version = "0.1.0"
description = "MCP server giving coding assistants the exact-version source and docs of your dependencies, with citations."
authors = [
    { name = "Aditya Khandelwal", email = "khandelwal.aditya840@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "mcp>=2.3.0",
    "numpy>=2.5.3",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    # 0.26.0 corrupts Node.start_point/end_point after the first read (wrong rows, then
    # segfaults). Lift this pin only once tests/test_chunkers.py passes on the new version.
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-language-pack>=1.20.0",
    "typer>=0.27.2",
]

[project.scripts]
grepwise = "grepwise.cli:app"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Fixtures are sample input with exact line numbers, and docs are prose: never lint them.
extend-exclude = ["tests/fixtures", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ["tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["tree_sitter_language_pack.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: slower end-to-end tests (still offline)"]
