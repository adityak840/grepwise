services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: grepwise
      POSTGRES_PASSWORD: grepwise
      POSTGRES_DB: grepwise
    ports:
      # Override the host port with POSTGRES_PORT in .env if 5432 is taken.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grepwise -d grepwise"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
