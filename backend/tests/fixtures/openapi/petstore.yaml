openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.27
paths:
  /pet:
    put:
      operationId: updatePet
      summary: Update an existing pet
      tags:
      - pet
      requestBody:
        $ref: '#/components/requestBodies/Pet'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found
    post:
      operationId: addPet
      summary: Add a new pet to the store
      tags:
      - pet
      requestBody:
        $ref: '#/components/requestBodies/Pet'
      responses:
        '200':
          description: Successful operation
  /pet/findByStatus:
    get:
      operationId: findPetsByStatus
      summary: Finds pets by status
      tags:
      - pet
      description: 'Multiple status values can be provided.

        Use commas to separate them.'
      parameters:
      - name: status
        in: query
        required: false
        description: Status values to filter by
        schema:
          type: string
          enum:
          - available
          - pending
          - sold
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
  /pet/{petId}:
    parameters:
    - $ref: '#/components/parameters/PetId'
    get:
      operationId: getPetById
      summary: Find pet by ID
      tags:
      - pet
      description: Returns a single pet
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
            application/xml:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found
    delete:
      operationId: deletePet
      summary: Deletes a pet
      tags:
      - pet
      deprecated: true
      responses:
        '400':
          description: Invalid pet value
  /store/order:
    post:
      operationId: placeOrder
      summary: Place an order for a pet
      tags:
      - store
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          $ref: '#/components/responses/OrderOk'
  /categories/{categoryId}:
    get:
      operationId: getCategory
      summary: Get a category and its parents
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: The category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
  /deep:
    get:
      operationId: getDeep
      summary: A deeply nested schema
      responses:
        '200':
          description: Nested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/A'
  /reports/big:
    get:
      operationId: getBigReport
      summary: Download the big daily report
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BigReport'
components:
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      description: ID of pet to return
      schema:
        type: integer
        format: int64
  requestBodies:
    Pet:
      description: Pet object
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Pet'
  responses:
    OrderOk:
      description: Order placed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Order'
  schemas:
    Pet:
      type: object
      required:
      - name
      - photoUrls
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: The pet's name
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          description: pet status in the store
          enum:
          - available
          - pending
          - sold
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        parent:
          $ref: '#/components/schemas/Category'
    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
        petId:
          type: integer
          format: int64
        quantity:
          type: integer
        shipDate:
          type: string
          format: date-time
        complete:
          type: boolean
    A:
      type: object
      properties:
        b:
          $ref: '#/components/schemas/B'
    B:
      type: object
      properties:
        c:
          $ref: '#/components/schemas/C'
    C:
      type: object
      properties:
        d:
          $ref: '#/components/schemas/D'
    D:
      type: object
      properties:
        value:
          type: string
    BigReport:
